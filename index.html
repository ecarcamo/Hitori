<!doctype html>
<html lang="es" data-theme="templo" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070709" />
    <meta name="description" content="Hitori: tu tablero, a tu ritmo." />
    <title>Hitori</title>
    <script>
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('hitori.appearance') || '{}').state || {}
          var themes = ['templo', 'ronin', 'verde', 'acero', 'mostaza']
          var modes = ['light', 'dark', 'system']
          var theme = themes.indexOf(stored.theme) >= 0 ? stored.theme : 'templo'
          var mode = modes.indexOf(stored.mode) >= 0 ? stored.mode : 'dark'
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.mode = mode
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
